<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi Go! Scoring App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sushi Go! <span id="gameVersion">Classic</span></h1>
            <div class="game-options">
                <label class="switch">
                    <input type="checkbox" id="partyToggle">
                    <span class="slider round"></span>
                </label>
                <span class="switch-label">Party Mode</span>
                <div class="theme-toggle">
                    <button id="themeBtn">🌙 Dark Mode</button>
                </div>
            </div>
        </header>
        
        <div id="setupScreen" class="setup-screen">
            <h2>Game Setup</h2>
            <div class="form-group">
                <label for="playerCount">Number of Players:</label>
                <input type="number" id="playerCount" min="2" max="5" value="3">
                <span id="partyPlayerRange" style="display:none;">(2-8 players in Party Mode)</span>
            </div>
            <div id="playerNames" class="player-names">
                <!-- Player name inputs will be added here -->
            </div>
            <button id="startGameBtn" class="btn-primary">Start Game</button>
        </div>
        
        <div id="gameScreen" class="game-screen" style="display: none;">
            <div class="round-info">
                <h2>Round <span id="currentRound">1</span>/3</h2>
                <div class="player-tabs" id="playerTabs">
                    <!-- Player tabs will be added here -->
                </div>
            </div>
            
            <div class="game-area">
                <div class="card-selection">
                    <h3>Select Cards for <span id="currentPlayerName">Player 1</span></h3>
                    <div class="card-grid" id="cardGrid">
                        <!-- Cards will be populated by JavaScript -->
                    </div>
                </div>
                
                <div class="scoring-area">
                    <h3>Current Score</h3>
                    <div class="score-display" id="scoreDisplay">
                        <div class="score-breakdown">
                            <p>Round Score: <span id="roundScore">0</span></p>
                            <p>Total Score: <span id="totalScore">0</span></p>
                            <div id="scoreDetails"></div>
                        </div>
                    </div>
                    <button id="nextPlayerBtn" class="btn-primary">Next Player</button>
                    <button id="nextRoundBtn" class="btn-secondary">Next Round</button>
                    <button id="resetBtn" class="btn-danger">Reset Selection</button>
                </div>
            </div>
            
            <div class="scoreboard">
                <h3>Scoreboard</h3>
                <table id="scoreboardTable">
                    <thead>
                        <tr>
                            <th>Player</th>
                            <th>Round 1</th>
                            <th>Round 2</th>
                            <th>Round 3</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Scores will be added here -->
                    </tbody>
                </table>
            </div>
            
            <div class="rules-section">
                <h3>Scoring Rules</h3>
                <div class="rules-container" id="rulesContainer">
                    <!-- Rules will be added here -->
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
